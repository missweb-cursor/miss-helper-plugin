name: "miss_砖哥助手"
version: "2.0.0"
description: "Managed-hosting plugin for Dify. Route B all-in-one toolkit (no remote debug)."
author: "you"
entry: "main:run"
tags: ["utility", "text", "translation", "http", "regex"]
categories: ["Developer Tools", "Utilities", "Language"]

tools:
  - name: "echo_text"
    label: "Echo Text"
    description: "Return the same text back."
    parameters:
      type: "object"
      properties:
        text:
          type: "string"
          description: "Text to echo"
      required: ["text"]

  - name: "transform_text"
    label: "Transform Text"
    description: "upper/lower/reverse a string."
    parameters:
      type: "object"
      properties:
        text:
          type: "string"
          description: "Text to transform"
        mode:
          type: "string"
          enum: ["upper","lower","reverse"]
          description: "Transform mode"
      required: ["text"]

  - name: "translate_text"
    label: "Translate Text"
    description: "LibreTranslate-compatible text translation."
    parameters:
      type: "object"
      properties:
        text:
          type: "string"
          description: "Text to translate"
        target_lang:
          type: "string"
          description: "Target language code, e.g. en, zh, ja, es"
        source_lang:
          type: "string"
          description: "Optional source code, e.g. auto, en"
      required: ["text","target_lang"]

  - name: "detect_language"
    label: "Detect Language"
    description: "Detect language of provided text."
    parameters:
      type: "object"
      properties:
        text:
          type: "string"
          description: "Text to detect"
      required: ["text"]

  - name: "summarize_text"
    label: "Summarize Text"
    description: "Extractive summary using frequency scoring."
    parameters:
      type: "object"
      properties:
        text: { type: "string" }
        sentences:
          type: "integer"
          minimum: 1
          maximum: 10
      required: ["text"]

  - name: "extract_keywords"
    label: "Extract Keywords"
    description: "Top keywords by frequency (stopword-filtered)."
    parameters:
      type: "object"
      properties:
        text: { type: "string" }
        top_k:
          type: "integer"
          minimum: 1
          maximum: 50
      required: ["text"]

  - name: "text_stats"
    label: "Text Stats"
    description: "Counts characters, words, lines."
    parameters:
      type: "object"
      properties:
        text: { type: "string" }
      required: ["text"]

  - name: "http_get"
    label: "HTTP GET"
    description: "Fetch a URL and return status, headers and preview text."
    parameters:
      type: "object"
      properties:
        url:    { type: "string" }
        timeout:
          type: "integer"
          minimum: 1
          maximum: 60
      required: ["url"]

  - name: "regex_extract"
    label: "Regex Extract"
    description: "Find regex matches in text."
    parameters:
      type: "object"
      properties:
        text:    { type: "string" }
        pattern: { type: "string" }
        flags:
          type: "array"
          items:
            type: "string"
            enum: ["I","M","S","U","X","A"]
      required: ["text","pattern"]
