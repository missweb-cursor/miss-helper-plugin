version: 0.0.3
type: plugin
author: missweb-cursor
name: miss_helper_plugin
label:
  en_US: Miss Helper Plugin
  zh_Hans: Miss助手插件
description:
  en_US: "A ready-to-use toolkit with HTTP / text utilities including translation, regex, text processing and more."
  zh_Hans: "一个即用型工具包，包含文本处理、HTTP请求、翻译、正则表达式等实用工具。"
icon: icon.png
tags:
  - utility
  - text
  - translation
  - http
  - regex
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: false
      llm: false
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
    node:
      enabled: false
    endpoint:
      enabled: false
    app:
      enabled: false
    storage:
      enabled: false
plugins:
  tools:
    - provider/miss_helper.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: null
created_at: "2024-11-07T00:00:00.000000000Z"
