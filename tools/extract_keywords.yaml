identity:
  name: extract_keywords
  author: missweb-cursor
  label:
    en_US: Extract Keywords
    zh_Hans: 提取关键词
description:
  human:
    en_US: Extract top keywords from text by frequency with stopword filtering.
    zh_Hans: 通过频率和停用词过滤从文本中提取关键词。
  llm: Extract the most important keywords from text based on word frequency, with automatic stopword filtering.
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Text
      zh_Hans: 文本
    human_description:
      en_US: Text to extract keywords from
      zh_Hans: 要提取关键词的文本
    llm_description: The text content to extract keywords from
    form: llm
  - name: top_k
    type: number
    required: false
    label:
      en_US: Number of Keywords
      zh_Hans: 关键词数量
    human_description:
      en_US: Number of keywords to extract (1-50, default is 10)
      zh_Hans: 要提取的关键词数量（1-50，默认为10）
    llm_description: "(Optional) The number of top keywords to return. Range: 1-50, default is 10"
    form: llm
extra:
  python:
    source: tools/extract_keywords.py
